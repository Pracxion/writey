[package]
name = "writey"
version = "0.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "io-util", "fs"] }
serenity = { version = "0.12", default-features = false, features = [
  "client",
  "gateway",
  "model",
  "rustls_backend",
  "cache",
]}

songbird = { version = "0.6", features = ["serenity", "gateway", "driver", "receive", "rustls"] }

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
poise = "0.6"

hound = "3.5"
dotenvy = "0.15"
chrono = "0.4"
async-trait = "0.1"
